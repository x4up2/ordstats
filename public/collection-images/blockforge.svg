<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
    <!-- ===== DEFS: pixel textures for each face ===== -->
    <defs>
      <!-- Top face: Alien Rock (magenta/purple with crystal facets) -->
      <pattern id="tex-grass" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(26.5) scale(1,0.5)">
        <rect width="20" height="20" fill="#9600a0"/>
        <rect x="0" y="0" width="5" height="5" fill="#8a00a0"/>
        <rect x="10" y="5" width="5" height="5" fill="#ff00c8"/>
        <rect x="5" y="10" width="5" height="5" fill="#a000b0"/>
        <rect x="15" y="15" width="5" height="5" fill="#ff00c8"/>
        <rect x="2" y="15" width="5" height="5" fill="#7a0090"/>
        <rect x="12" y="0" width="5" height="5" fill="#a800b8"/>
        <rect x="15" y="8" width="5" height="5" fill="#ff00c8"/>
      </pattern>
      <!-- Left face: Ench Sub (dark purple with bright purple veins) -->
      <pattern id="tex-stone" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="skewY(26.5) scale(0.85,1)">
        <rect width="20" height="20" fill="#1c0a37"/>
        <rect x="0" y="0" width="5" height="5" fill="#200e3a"/>
        <rect x="10" y="5" width="5" height="5" fill="#1a0833"/>
        <rect x="5" y="10" width="5" height="5" fill="#220f3d"/>
        <rect x="15" y="15" width="5" height="5" fill="#180730"/>
        <rect x="3" y="3" width="3" height="3" fill="#b43cff"/>
        <rect x="14" y="8" width="3" height="3" fill="#b43cff"/>
        <rect x="8" y="16" width="3" height="3" fill="#b43cff"/>
      </pattern>
      <!-- Right face: Crystal (teal-purple gradient with white sparkles) -->
      <pattern id="tex-dirt" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="skewY(-26.5) scale(0.85,1)">
        <rect width="20" height="20" fill="#50269e"/>
        <rect x="0" y="0" width="5" height="10" fill="#3a1e8e"/>
        <rect x="5" y="0" width="5" height="10" fill="#46228e"/>
        <rect x="10" y="0" width="5" height="10" fill="#5a2eae"/>
        <rect x="15" y="0" width="5" height="10" fill="#6e36ae"/>
        <rect x="0" y="10" width="5" height="10" fill="#462898"/>
        <rect x="5" y="10" width="5" height="10" fill="#5a30a8"/>
        <rect x="10" y="10" width="5" height="10" fill="#6834b0"/>
        <rect x="15" y="10" width="5" height="10" fill="#7a3cb0"/>
        <!-- White sparkle highlights -->
        <rect x="3" y="3" width="2" height="2" fill="#fff" opacity="0.9"/>
        <rect x="14" y="12" width="2" height="2" fill="#fff" opacity="0.7"/>
        <rect x="8" y="7" width="2" height="2" fill="#ddf" opacity="0.5"/>
      </pattern>
    </defs>

    <!-- ===== ISOMETRIC BLOCK (larger, centered) ===== -->
    <!-- Top face — grass -->
    <polygon points="150,40 245,88 150,135 55,88" fill="url(#tex-grass)"/>
    <polygon points="150,40 245,88 150,135 55,88" fill="rgba(255,200,255,0.1)"/>
    <!-- Left face — stone -->
    <polygon points="55,88 150,135 150,220 55,172" fill="url(#tex-stone)"/>
    <polygon points="55,88 150,135 150,220 55,172" fill="rgba(0,0,0,0.2)"/>
    <!-- Right face — dirt -->
    <polygon points="245,88 150,135 150,220 245,172" fill="url(#tex-dirt)"/>
    <polygon points="245,88 150,135 150,220 245,172" fill="rgba(0,0,0,0.35)"/>

    <!-- Edge highlights -->
    <line x1="150" y1="40" x2="150" y2="135" stroke="#ffe8c0" stroke-width="1" opacity="0.3"/>
    <line x1="55" y1="88" x2="150" y2="40" stroke="#ffe8c0" stroke-width="1" opacity="0.4"/>
    <line x1="245" y1="88" x2="150" y2="40" stroke="#ffe8c0" stroke-width="1" opacity="0.4"/>
    <line x1="150" y1="135" x2="150" y2="220" stroke="#000" stroke-width="0.8" opacity="0.3"/>
    <line x1="55" y1="88" x2="55" y2="172" stroke="#000" stroke-width="0.5" opacity="0.2"/>
    <line x1="245" y1="88" x2="245" y2="172" stroke="#000" stroke-width="0.5" opacity="0.2"/>
    <line x1="55" y1="172" x2="150" y2="220" stroke="#000" stroke-width="0.5" opacity="0.2"/>
    <line x1="245" y1="172" x2="150" y2="220" stroke="#000" stroke-width="0.5" opacity="0.2"/>

    <!-- ===== LEFT MALLET (pixel-art style) ===== -->
    <g transform="translate(120,130) rotate(40)" shape-rendering="crispEdges">
      <!-- Handle — blocky pixel shaft -->
      <rect x="-4" y="-68" width="8" height="12" fill="#2a1048"/>
      <rect x="-4" y="-56" width="8" height="12" fill="#321258"/>
      <rect x="-4" y="-44" width="8" height="12" fill="#2a1048"/>
      <rect x="-4" y="-32" width="8" height="12" fill="#321258"/>
      <rect x="-4" y="-20" width="8" height="6" fill="#2a1048"/>
      <!-- Grip wraps -->
      <rect x="-6" y="-24" width="12" height="4" fill="#4a2070"/>
      <rect x="-6" y="-34" width="12" height="4" fill="#4a2070"/>
      <!-- Head — blocky stepped rectangle -->
      <rect x="-20" y="-92" width="40" height="4" fill="#9955dd"/>
      <rect x="-22" y="-88" width="44" height="4" fill="#6a30b0"/>
      <rect x="-22" y="-84" width="22" height="8" fill="#5828a0"/>
      <rect x="0" y="-84" width="22" height="8" fill="#7c3cc0"/>
      <rect x="-22" y="-76" width="44" height="4" fill="#6a30b0"/>
      <rect x="-20" y="-72" width="40" height="4" fill="#4a2080"/>
      <!-- Metal band -->
      <rect x="-6" y="-70" width="12" height="4" fill="#3a1868"/>
    </g>

    <!-- ===== RIGHT MALLET (pixel-art style, mirrored) ===== -->
    <g transform="translate(180,130) rotate(-40)" shape-rendering="crispEdges">
      <rect x="-4" y="-68" width="8" height="12" fill="#2a1048"/>
      <rect x="-4" y="-56" width="8" height="12" fill="#321258"/>
      <rect x="-4" y="-44" width="8" height="12" fill="#2a1048"/>
      <rect x="-4" y="-32" width="8" height="12" fill="#321258"/>
      <rect x="-4" y="-20" width="8" height="6" fill="#2a1048"/>
      <rect x="-6" y="-24" width="12" height="4" fill="#4a2070"/>
      <rect x="-6" y="-34" width="12" height="4" fill="#4a2070"/>
      <rect x="-20" y="-92" width="40" height="4" fill="#9955dd"/>
      <rect x="-22" y="-88" width="44" height="4" fill="#6a30b0"/>
      <rect x="-22" y="-84" width="22" height="8" fill="#5828a0"/>
      <rect x="0" y="-84" width="22" height="8" fill="#7c3cc0"/>
      <rect x="-22" y="-76" width="44" height="4" fill="#6a30b0"/>
      <rect x="-20" y="-72" width="40" height="4" fill="#4a2080"/>
      <rect x="-6" y="-70" width="12" height="4" fill="#3a1868"/>
    </g>

    <!-- ===== "B" on left face — isometric ===== -->
    <g transform="translate(80,170) skewY(26.5) scale(1,1)">
      <text font-family="monospace" font-weight="bold" font-size="70" fill="#b43cff" opacity="1">B</text>
    </g>
    <!-- ===== "F" on right face — isometric ===== -->
    <g transform="translate(178,192) skewY(-26.5) scale(1,1)">
      <text font-family="monospace" font-weight="bold" font-size="70" fill="#c8aaff" opacity="0.85">F</text>
    </g>
</svg>
